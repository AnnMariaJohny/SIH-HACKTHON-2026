
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCEANOVA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 38%, rgba(27, 66, 116, 0.5), transparent 29%), radial-gradient(ellipse at 50% 42%, rgba(22, 92, 151, 0.16), transparent 48%), #02030b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        #earth-animation {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            z-index: 0;
            pointer-events: none;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }

        /* Shift 3D scene up when transitioning to auth section */
        body.auth-open #webgl-container {
            transform: translateY(-20%);
        }

        /* Main UI Container */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }

        body.auth-open #ui-layer {
            transform: translateY(-100%);
        }

        /* Title text revealed when satellite reaches center */
        .title-container {
            text-align: center;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            position: relative;
            z-index: 2;
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .title-container.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .brand-title {
            font-size: 6.5rem;
            font-weight: 650;
            letter-spacing: 0.015em;
            text-transform: uppercase;
            color: #f5f8ff;
            text-shadow: 0 0 20px rgba(198, 224, 255, 0.22);
        }

        .brand-title span {
            color: #08c8f5;
            text-shadow: 0 0 22px rgba(0, 195, 255, 0.48);
        }

        /* Bottom swipe button */
        .scroll-button-container {
            position: absolute;
            bottom: 40px;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.6s ease 0.1s, transform 0.6s ease 0.1s;
            pointer-events: auto;
        }

        .scroll-button-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .scroll-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 14px 28px;
            border-radius: 30px;
            color: #ffffff;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .scroll-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .chevron {
            width: 10px;
            height: 10px;
            border-bottom: 2px solid #ffffff;
            border-right: 2px solid #ffffff;
            transform: rotate(45deg);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) rotate(45deg); }
            40% { transform: translateY(5px) rotate(45deg); }
            60% { transform: translateY(2px) rotate(45deg); }
        }

        /* Auth Section (Login & Register Buttons) */
        #auth-overlay {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }

        body.auth-open #auth-overlay {
            transform: translateY(-100%);
        }

        .auth-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            background: rgba(10, 15, 30, 0.6);
            padding: 50px 60px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .auth-btn {
            width: 100%;
            padding: 16px 32px;
            border-radius: 30px;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
        }

        .btn-login {
            background: #ffffff;
            color: #020208;
            border: 1px solid #ffffff;
        }

        .btn-login:hover {
            background: #a5c7ff;
            border-color: #a5c7ff;
            box-shadow: 0 0 25px rgba(165, 199, 255, 0.4);
        }

        .btn-register {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-register:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
        }

        .back-btn {
            margin-top: 15px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .brand-title {
                font-size: 3rem;
                letter-spacing: 0.015em;
            }
            .auth-container {
                padding: 40px 30px;
            }
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <iframe id="earth-animation" src="earth/Animation/index.html" title="Rotating Earth animation" aria-hidden="true" tabindex="-1"></iframe>
    <div id="webgl-container"></div>

    <!-- Main Title & Swipe Button Layer -->
    <div id="ui-layer">
        <div class="title-container" id="brandTitle">
            <h1 class="brand-title">OCEA<span>NOVA</span></h1>
        </div>

        <div class="scroll-button-container" id="scrollBtnContainer">
            <button class="scroll-btn" id="scrollBtn">
                <span>Click to scroll</span>
                <div class="chevron"></div>
            </button>
        </div>
    </div>

    <!-- Login & Register Overlay Layer -->
    <div id="auth-overlay">
        <div class="auth-container">
            <h2 class="auth-title">Welcome</h2>
            <button class="auth-btn btn-login" id="loginBtn">Login</button>
            <button class="auth-btn btn-register" id="registerBtn">Register</button>
            <button class="back-btn" id="backBtn">← Back</button>
        </div>
    </div>

    <script>
        // Setup Scene, Camera, Renderer
        const container = document.getElementById('webgl-container');
        const earthFrame = document.getElementById('earth-animation');
        let earthSceneReady = false;
        let satelliteCentered = false;
        const earthReadyFallback = window.setTimeout(() => {
            earthSceneReady = true;
            satelliteCentered = true;
        }, 8000);

        window.addEventListener('message', event => {
            if (event.source !== earthFrame.contentWindow || event.origin !== window.location.origin) return;
            if (event.data?.type === 'oceanova-earth-ready') {
                earthSceneReady = true;
                window.clearTimeout(earthReadyFallback);
            }
            if (event.data?.type === 'oceanova-satellite-centered') satelliteCentered = true;
        });

        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.setClearColor(0x000000, 0);
        container.appendChild(renderer.domElement);

        // Layered starfield for varied depth, brightness, and color.
        function createStarLayer(count, size, opacity, colors) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const color = new THREE.Color();
            const starColors = new Float32Array(count * 3);

            for (let index = 0; index < count; index++) {
                const offset = index * 3;
                positions[offset] = (Math.random() - 0.5) * 90;
                positions[offset + 1] = (Math.random() - 0.5) * 55;
                positions[offset + 2] = -20 - Math.random() * 55;
                color.set(colors[Math.floor(Math.random() * colors.length)]);
                starColors[offset] = color.r;
                starColors[offset + 1] = color.g;
                starColors[offset + 2] = color.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

            const material = new THREE.PointsMaterial({
                size,
                vertexColors: true,
                transparent: true,
                opacity,
                sizeAttenuation: true
            });

            return new THREE.Points(geometry, material);
        }

        const starField = createStarLayer(11000, 0.038, 0.78, [0xffffff, 0xf5f8ff, 0xdceaff, 0xb8d8ff]);
        const brightStars = createStarLayer(190, 0.085, 0.84, [0xffffff, 0xe7f2ff, 0xc9e3ff]);
        const warmStars = createStarLayer(48, 0.11, 0.68, [0xffe4c2, 0xffffff]);
        const starLayers = [starField, brightStars, warmStars];
        scene.add(starField, brightStars, warmStars);

        // Lighting
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
        sunLight.position.set(-5, 3.5, 4);
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0x26364d, 0.48);
        scene.add(ambientLight);

        // Zoom over the canvas without changing page scroll navigation.
        renderer.domElement.addEventListener('wheel', event => {
            if (document.body.classList.contains('auth-open')) return;
            event.preventDefault();
            event.stopPropagation();
            camera.position.z = THREE.MathUtils.clamp(camera.position.z + event.deltaY * 0.003, 3.8, 8);
        }, { passive: false });

        // Animation
        const brandTitle = document.getElementById('brandTitle');
        const scrollBtnContainer = document.getElementById('scrollBtnContainer');

        function animate(currentTime) {
            requestAnimationFrame(animate);

            if (!earthSceneReady) {
                renderer.render(scene, camera);
                return;
            }

            starField.rotation.y += 0.000015;
            brightStars.rotation.y -= 0.00001;
            warmStars.rotation.y += 0.000008;
            starField.material.opacity = 0.68 + Math.sin(currentTime * 0.0017) * 0.15;
            brightStars.material.opacity = 0.7 + Math.sin(currentTime * 0.0024 + 1.3) * 0.25;
            warmStars.material.opacity = 0.52 + Math.sin(currentTime * 0.0019 + 2.1) * 0.22;

            if (satelliteCentered && !brandTitle.classList.contains('visible')) {
                brandTitle.classList.add('visible');
                scrollBtnContainer.classList.add('visible');
            }

            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Scroll & Auth Toggle Controls
        const scrollBtn = document.getElementById('scrollBtn');
        const backBtn = document.getElementById('backBtn');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');

        function openAuth() {
            if (scrollBtnContainer.classList.contains('visible')) {
                document.body.classList.add('auth-open');
            }
        }

        scrollBtn.addEventListener('click', openAuth);

        let touchStartY = null;
        window.addEventListener('touchstart', event => {
            touchStartY = event.changedTouches[0]?.screenY ?? null;
        }, { passive: true });

        window.addEventListener('touchend', event => {
            const touchEndY = event.changedTouches[0]?.screenY;
            if (touchStartY !== null && touchEndY !== undefined && touchStartY - touchEndY > 45) {
                openAuth();
            }
            touchStartY = null;
        }, { passive: true });

        window.addEventListener('wheel', event => {
            if (event.deltaY > 0) openAuth();
        }, { passive: true });

        backBtn.addEventListener('click', () => {
            document.body.classList.remove('auth-open');
        });

        // Click handlers for your login and register buttons
        loginBtn.addEventListener('click', () => {
            window.location.href = 'LOGIN/Sih-oilspil-main/Login/Index.html';
        });

        registerBtn.addEventListener('click', () => {
            window.location.href = 'LOGIN/Sih-oilspil-main/register/index.html';
        });
    </script>
</body>
</html>
