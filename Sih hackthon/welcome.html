
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCEANOVA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 38%, rgba(27, 66, 116, 0.5), transparent 29%), radial-gradient(ellipse at 50% 42%, rgba(22, 92, 151, 0.16), transparent 48%), #02030b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        #earth-animation {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            z-index: 0;
            pointer-events: none;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }

        /* Shift 3D scene up when transitioning to auth section */
        body.auth-open #webgl-container {
            transform: translateY(-20%);
        }

        /* Main UI Container */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }

        body.auth-open #ui-layer {
            transform: translateY(-100%);
        }

        /* Title text revealed when satellite reaches center */
        .title-container {
            text-align: center;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            position: relative;
            z-index: 2;
            transition: opacity 2s ease, transform 2s ease;
        }

        .title-container.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .brand-title {
            font-size: 5.2rem;
            font-weight: 650;
            letter-spacing: 0.015em;
            text-transform: uppercase;
            color: #f5f8ff;
            text-shadow: 0 0 20px rgba(198, 224, 255, 0.22);
        }

        .brand-title span {
            color: #08c8f5;
            text-shadow: 0 0 22px rgba(0, 195, 255, 0.48);
        }

        /* Bottom swipe button */
        .scroll-button-container {
            position: absolute;
            bottom: 40px;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 1.5s ease 1s, transform 1.5s ease 1s;
            pointer-events: auto;
        }

        .scroll-button-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .scroll-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 14px 28px;
            border-radius: 30px;
            color: #ffffff;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .scroll-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .chevron {
            width: 10px;
            height: 10px;
            border-bottom: 2px solid #ffffff;
            border-right: 2px solid #ffffff;
            transform: rotate(45deg);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) rotate(45deg); }
            40% { transform: translateY(5px) rotate(45deg); }
            60% { transform: translateY(2px) rotate(45deg); }
        }

        /* Auth Section (Login & Register Buttons) */
        #auth-overlay {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }

        body.auth-open #auth-overlay {
            transform: translateY(-100%);
        }

        .auth-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            background: rgba(10, 15, 30, 0.6);
            padding: 50px 60px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .auth-btn {
            width: 100%;
            padding: 16px 32px;
            border-radius: 30px;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
        }

        .btn-login {
            background: #ffffff;
            color: #020208;
            border: 1px solid #ffffff;
        }

        .btn-login:hover {
            background: #a5c7ff;
            border-color: #a5c7ff;
            box-shadow: 0 0 25px rgba(165, 199, 255, 0.4);
        }

        .btn-register {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-register:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
        }

        .back-btn {
            margin-top: 15px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .brand-title {
                font-size: 2.8rem;
                letter-spacing: 0.015em;
            }
            .auth-container {
                padding: 40px 30px;
            }
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <iframe id="earth-animation" src="earth/Animation/index.html" title="Rotating Earth animation" aria-hidden="true" tabindex="-1"></iframe>
    <div id="webgl-container"></div>

    <!-- Main Title & Swipe Button Layer -->
    <div id="ui-layer">
        <div class="title-container" id="brandTitle">
            <h1 class="brand-title">OCEA<span>NOVA</span></h1>
        </div>

        <div class="scroll-button-container" id="scrollBtnContainer">
            <button class="scroll-btn" id="scrollBtn">
                <span>Swipe to scroll</span>
                <div class="chevron"></div>
            </button>
        </div>
    </div>

    <!-- Login & Register Overlay Layer -->
    <div id="auth-overlay">
        <div class="auth-container">
            <h2 class="auth-title">Welcome</h2>
            <button class="auth-btn btn-login" id="loginBtn">Login</button>
            <button class="auth-btn btn-register" id="registerBtn">Register</button>
            <button class="back-btn" id="backBtn">← Back</button>
        </div>
    </div>

    <script>
        // Setup Scene, Camera, Renderer
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.setClearColor(0x000000, 0);
        container.appendChild(renderer.domElement);

        // Detailed communications satellite with a bus, antenna dishes, booms, and segmented solar arrays.
        function createSatellite() {
            const satGroup = new THREE.Group();
            const bus = new THREE.Group();
            satGroup.add(bus);
            const gold = new THREE.MeshStandardMaterial({ color: 0xb89762, metalness: 0.72, roughness: 0.34 });
            const darkGold = new THREE.MeshStandardMaterial({ color: 0x625640, metalness: 0.68, roughness: 0.4 });
            const silver = new THREE.MeshStandardMaterial({ color: 0xc9d0d1, metalness: 0.82, roughness: 0.24 });
            const dark = new THREE.MeshStandardMaterial({ color: 0x18222b, metalness: 0.55, roughness: 0.38 });
            const panelBase = new THREE.MeshStandardMaterial({ color: 0x102c50, metalness: 0.52, roughness: 0.28, emissive: 0x06111b, emissiveIntensity: 0.12 });
            const cellMat = new THREE.MeshStandardMaterial({ color: 0x174c79, metalness: 0.48, roughness: 0.3, emissive: 0x07131d, emissiveIntensity: 0.1 });
            const frameMat = new THREE.MeshStandardMaterial({ color: 0xb8c5ca, metalness: 0.9, roughness: 0.2 });
            const foil = new THREE.MeshStandardMaterial({ color: 0xc9ad70, metalness: 0.7, roughness: 0.38 });
            const instrument = new THREE.MeshStandardMaterial({ color: 0x101720, metalness: 0.62, roughness: 0.3 });
            const addBox = (parent, size, pos, mat) => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), mat);
                mesh.position.set(...pos); parent.add(mesh); return mesh;
            };
            addBox(bus, [0.54, 0.46, 0.48], [0, 0, 0], gold);
            addBox(bus, [0.56, 0.035, 0.5], [0, 0.245, 0], darkGold);
            addBox(bus, [0.56, 0.035, 0.5], [0, -0.245, 0], darkGold);
            addBox(bus, [0.035, 0.34, 0.38], [0.285, 0, 0], silver);
            addBox(bus, [0.025, 0.3, 0.34], [-0.282, 0, 0], dark);
            // Layered equipment housings and thermal blankets add depth to the spacecraft bus.
            addBox(bus, [0.16, 0.2, 0.07], [-0.16, 0.16, 0.29], foil).rotation.z = -0.22;
            addBox(bus, [0.12, 0.18, 0.08], [0.19, 0.12, 0.29], darkGold).rotation.z = 0.28;
            addBox(bus, [0.2, 0.12, 0.07], [-0.12, -0.18, 0.29], gold).rotation.z = 0.18;
            addBox(bus, [0.13, 0.1, 0.08], [0.16, -0.16, 0.29], foil).rotation.z = -0.32;
            for (let seam = -2; seam <= 2; seam++) addBox(bus, [0.018, 0.42, 0.008], [seam * 0.085, 0, 0.284], darkGold);
            for (let fin = 0; fin < 4; fin++) addBox(bus, [0.07, 0.015, 0.22], [-0.12 + fin * 0.08, 0.29, -0.02], silver);
            addBox(bus, [0.16, 0.12, 0.12], [0.34, 0.12, -0.02], darkGold);
            addBox(bus, [0.13, 0.1, 0.1], [-0.34, -0.11, -0.03], gold);
            // Front-facing service panels, optical ports, and thermal foil details.
            addBox(bus, [0.18, 0.16, 0.018], [-0.13, 0.02, 0.257], instrument);
            addBox(bus, [0.13, 0.11, 0.014], [0.12, -0.04, 0.257], darkGold);
            addBox(bus, [0.34, 0.055, 0.012], [0, -0.17, 0.257], foil);
            for (let vent = 0; vent < 5; vent++) {
                addBox(bus, [0.012, 0.055, 0.006], [-0.19 + vent * 0.025, 0.02, 0.27], silver);
            }
            const opticalPort = new THREE.Mesh(new THREE.CylinderGeometry(0.047, 0.047, 0.018, 24), dark);
            opticalPort.rotation.x = Math.PI / 2; opticalPort.position.set(0.12, -0.04, 0.273); bus.add(opticalPort);
            const lens = new THREE.Mesh(new THREE.CircleGeometry(0.034, 24), new THREE.MeshStandardMaterial({ color: 0x355b75, metalness: 0.35, roughness: 0.16, emissive: 0x0d1b27, emissiveIntensity: 0.25 }));
            lens.position.set(0.12, -0.04, 0.285); bus.add(lens);
            for (const x of [-0.22, 0.22]) for (const y of [-0.19, 0.19]) {
                const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.012, 10), silver);
                bolt.rotation.x = Math.PI / 2; bolt.position.set(x, y, 0.26); bus.add(bolt);
            }
            for (let i = -2; i <= 2; i++) {
                addBox(bus, [0.014, 0.026, 0.37], [i * 0.09, 0.268, 0], silver);
                addBox(bus, [0.38, 0.022, 0.012], [0, i * 0.075, 0.251], silver);
            }
            const boom = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.02, 0.72, 12), silver);
            boom.position.set(-0.35, 0.38, 0.03); boom.rotation.z = -0.48; bus.add(boom);
            function addDish(position, radius, tilt) {
                const dishGroup = new THREE.Group();
                dishGroup.position.set(...position); dishGroup.rotation.set(tilt, 0, -0.25);
                const dishMat = new THREE.MeshStandardMaterial({ color: 0xd9dfe0, metalness: 0.88, roughness: 0.18, side: THREE.DoubleSide });
                const dish = new THREE.Mesh(new THREE.SphereGeometry(radius, 48, 32, 0, Math.PI * 2, 0, Math.PI * 0.34), dishMat);
                dish.rotation.x = Math.PI; dishGroup.add(dish);
                const rim = new THREE.Mesh(new THREE.TorusGeometry(radius * 0.94, radius * 0.035, 8, 40), frameMat);
                dishGroup.add(rim);
                const back = new THREE.Mesh(new THREE.SphereGeometry(radius * 0.94, 32, 16, 0, Math.PI * 2, Math.PI * 0.66, Math.PI * 0.34), dark);
                dishGroup.add(back);
                const support = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.012, radius * 0.8, 10), silver);
                support.position.set(0, -radius * 0.45, radius * 0.2); dishGroup.add(support);
                const feedArm = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, radius * 0.82, 8), silver);
                feedArm.position.z = radius * 0.56; dishGroup.add(feedArm);
                const feed = new THREE.Mesh(new THREE.SphereGeometry(radius * 0.1, 16, 12), gold);
                feed.position.z = radius * 0.95; dishGroup.add(feed);
                const feedCap = new THREE.Mesh(new THREE.SphereGeometry(radius * 0.045, 12, 10), dark);
                feedCap.position.z = radius * 1.08; dishGroup.add(feedCap);
                satGroup.add(dishGroup);
            }
            addDish([-0.5, 0.58, 0.15], 0.23, 0.32);
            addDish([-0.34, 0.82, 0.08], 0.19, 0.2);
            addDish([-0.08, 0.88, 0.12], 0.15, 0.28);
            addDish([0.18, 0.73, 0.1], 0.11, 0.36);
            function addSolarWing(ySign) {
                const wing = new THREE.Group();
                wing.position.set(0.02, ySign * 0.3, 0);
                const panelWidth = 0.58, panelHeight = 2.05;
                addBox(wing, [panelWidth, panelHeight, 0.025], [0, ySign * (panelHeight / 2), 0], panelBase);
                for (let col = -1; col <= 1; col++) {
                    for (let row = 0; row < 10; row++) {
                        const cw = panelWidth / 3 - 0.018, ch = panelHeight / 10 - 0.018;
                        addBox(wing, [cw, ch, 0.009], [col * panelWidth / 3, ySign * (panelHeight / 2 - (row + 0.5) * panelHeight / 10), 0.018], cellMat);
                    }
                }
                for (const x of [-panelWidth / 2, 0, panelWidth / 2]) addBox(wing, [0.014, panelHeight + 0.04, 0.022], [x, 0, 0.023], frameMat);
                for (let row = 0; row <= 10; row++) addBox(wing, [panelWidth + 0.025, 0.014, 0.022], [0, ySign * (panelHeight / 2 - row * panelHeight / 10), 0.023], frameMat);
                // Dark photovoltaic cells with structural support rails behind each wing.
                addBox(wing, [0.025, panelHeight + 0.08, 0.026], [0, 0, -0.025], dark);
                const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.13, 20), silver);
                hinge.rotation.z = Math.PI / 2; hinge.position.set(0, ySign * 0.1, 0); satGroup.add(hinge);
                satGroup.add(wing);
            }
            addSolarWing(1); addSolarWing(-1);
            const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.48, 10), silver);
            mast.position.set(0.1, -0.42, -0.08); bus.add(mast);
            const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 10), new THREE.MeshStandardMaterial({ color: 0xffd58a, emissive: 0x7a3f0a, emissiveIntensity: 0.8 }));
            beacon.position.set(0.1, -0.67, -0.08); bus.add(beacon);
            return satGroup;
        }

        const satellite = createSatellite();
        scene.add(satellite);
        satellite.position.set(1.8, 1.2, 1.5);
        satellite.rotation.set(0.18, -0.18, -0.62);
        // Match the Earth animation's apparent diameter at the centered camera position.
        satellite.scale.setScalar(0.56);

        // Layered starfield for varied depth, brightness, and color.
        function createStarLayer(count, size, opacity, colors) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const color = new THREE.Color();
            const starColors = new Float32Array(count * 3);

            for (let index = 0; index < count; index++) {
                const offset = index * 3;
                positions[offset] = (Math.random() - 0.5) * 90;
                positions[offset + 1] = (Math.random() - 0.5) * 55;
                positions[offset + 2] = -20 - Math.random() * 55;
                color.set(colors[Math.floor(Math.random() * colors.length)]);
                starColors[offset] = color.r;
                starColors[offset + 1] = color.g;
                starColors[offset + 2] = color.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

            const material = new THREE.PointsMaterial({
                size,
                vertexColors: true,
                transparent: true,
                opacity,
                sizeAttenuation: true
            });

            return new THREE.Points(geometry, material);
        }

        const starField = createStarLayer(11000, 0.038, 0.78, [0xffffff, 0xf5f8ff, 0xdceaff, 0xb8d8ff]);
        const brightStars = createStarLayer(190, 0.085, 0.84, [0xffffff, 0xe7f2ff, 0xc9e3ff]);
        const warmStars = createStarLayer(48, 0.11, 0.68, [0xffe4c2, 0xffffff]);
        const starLayers = [starField, brightStars, warmStars];
        scene.add(starField, brightStars, warmStars);

        // Lighting
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
        sunLight.position.set(-5, 3.5, 4);
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0x26364d, 0.48);
        scene.add(ambientLight);

        // Zoom over the canvas without changing page scroll navigation.
        renderer.domElement.addEventListener('wheel', event => {
            if (document.body.classList.contains('auth-open')) return;
            event.preventDefault();
            event.stopPropagation();
            camera.position.z = THREE.MathUtils.clamp(camera.position.z + event.deltaY * 0.003, 3.8, 8);
        }, { passive: false });

        // Animation
        let startTime = null;
        const animationDuration = 4200;

        const brandTitle = document.getElementById('brandTitle');
        const scrollBtnContainer = document.getElementById('scrollBtnContainer');

        function animate(currentTime) {
            requestAnimationFrame(animate);

            if (!startTime) startTime = currentTime;
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / animationDuration, 1.0);

            const easeProgress = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;

            starField.rotation.y += 0.000015;
            brightStars.rotation.y -= 0.00001;
            warmStars.rotation.y += 0.000008;
            starField.material.opacity = 0.68 + Math.sin(currentTime * 0.0017) * 0.15;
            brightStars.material.opacity = 0.7 + Math.sin(currentTime * 0.0024 + 1.3) * 0.25;
            warmStars.material.opacity = 0.52 + Math.sin(currentTime * 0.0019 + 2.1) * 0.22;

            satellite.position.x = THREE.MathUtils.lerp(1.7, 0, easeProgress);
            satellite.position.y = THREE.MathUtils.lerp(1.15, 0, easeProgress);
            satellite.position.z = THREE.MathUtils.lerp(1.15, 0, easeProgress);

            // Settle with the instrument face and antenna dishes directed toward the viewer.
            satellite.rotation.x = THREE.MathUtils.lerp(0.24, 0, easeProgress);
            satellite.rotation.y = THREE.MathUtils.lerp(-0.2, 0, easeProgress);
            satellite.rotation.z = THREE.MathUtils.lerp(-0.62, 0, easeProgress);

            if (progress > 0.85 && !brandTitle.classList.contains('visible')) {
                brandTitle.classList.add('visible');
                scrollBtnContainer.classList.add('visible');
            }

            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Scroll & Auth Toggle Controls
        const scrollBtn = document.getElementById('scrollBtn');
        const backBtn = document.getElementById('backBtn');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');

        function openAuth() {
            if (scrollBtnContainer.classList.contains('visible')) {
                document.body.classList.add('auth-open');
            }
        }

        scrollBtn.addEventListener('click', openAuth);

        let touchStartY = null;
        window.addEventListener('touchstart', event => {
            touchStartY = event.changedTouches[0]?.screenY ?? null;
        }, { passive: true });

        window.addEventListener('touchend', event => {
            const touchEndY = event.changedTouches[0]?.screenY;
            if (touchStartY !== null && touchEndY !== undefined && touchStartY - touchEndY > 45) {
                openAuth();
            }
            touchStartY = null;
        }, { passive: true });

        window.addEventListener('wheel', event => {
            if (event.deltaY > 0) openAuth();
        }, { passive: true });

        backBtn.addEventListener('click', () => {
            document.body.classList.remove('auth-open');
        });

        // Click handlers for your login and register buttons
        loginBtn.addEventListener('click', () => {
            window.location.href = 'LOGIN/Sih-oilspil-main/Login/Index.html';
        });

        registerBtn.addEventListener('click', () => {
            window.location.href = 'LOGIN/Sih-oilspil-main/register/index.html';
        });
    </script>
</body>
</html>
