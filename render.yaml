services:
  - type: web
    name: oceanova-sar-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

  - type: web
    name: oceanova-industry-api
    runtime: python
    plan: free
    rootDir: sih-backend-main/sih-backend-main/bakend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEOAPIFY_API_KEY
        sync: false

  - type: web
    name: oceanova-vessel-api
    runtime: python
    plan: free
    rootDir: anzil/sih_backend-main/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AISSTREAM_API_KEY
        sync: false
